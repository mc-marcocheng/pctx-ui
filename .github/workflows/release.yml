name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - run: npm ci
      - run: node scripts/check-release-version.mjs
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  build:
    needs: verify

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - variant: unbundled
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
            bundles: msi,nsis
          - variant: bundled
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
            bundles: msi,nsis

          # macOS x86_64 (cross-compiled from the arm64 runner; GitHub has
          # retired Intel-native macOS hosted runners)
          - variant: unbundled
            os: macos-14
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
            bundles: dmg
          - variant: bundled
            os: macos-14
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
            bundles: dmg

          # macOS arm64
          - variant: unbundled
            os: macos-14
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            bundles: dmg
          - variant: bundled
            os: macos-14
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            bundles: dmg

          # Linux x86_64
          - variant: unbundled
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
            bundles: deb,appimage
          - variant: bundled
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
            bundles: deb,appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - run: npm ci

      - name: Prepare bundled pctx
        if: matrix.variant == 'bundled'
        run: >
          npm run prepare:pctx-bundle --
          --platform ${{ matrix.platform == 'macos' && 'darwin' || matrix.platform == 'windows' && 'win32' || 'linux' }}
          --arch ${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}

      - name: Build unbundled installers
        if: matrix.variant == 'unbundled'
        run: >
          npm run tauri:build:unbundled --
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}

      - name: Build bundled installers
        if: matrix.variant == 'bundled'
        run: >
          npm run tauri --
          build
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}
          --config src-tauri/tauri.bundled.conf.json

      - name: Collect release packages
        run: >
          node scripts/collect-release-artifacts.mjs
          --target ${{ matrix.target }}
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --variant ${{ matrix.variant }}

      - uses: actions/upload-artifact@v4
        with:
          name: pctx-ui-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}
          path: release-dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Create release information
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const pin = JSON.parse(fs.readFileSync("bundled-pctx.json", "utf8"));

          fs.writeFileSync(
            "release-body.md",
            [
              "## Available editions",
              "",
              `- **Bundled:** includes pctx v${pin.version} and requires no separate engine installation.`,
              "- **Unbundled:** requires a compatible pctx engine (`>=1.1.0, <2.0.0`).",
              "",
              "Install the engine for the unbundled edition with:",
              "",
              "```bash",
              "cargo install pctx",
              "```",
              "",
              "Bundled and unbundled installers are alternative editions of the same application.",
              "",
            ].join("\n")
          );
          NODE

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          generate_release_notes: true
          files: release-dist/**/*
